[project]
name = "volvo-delivery"
version = "0.3.0"
description = "Volvo delivery tracking for Home Assistant"
requires-python = ">=3.13"

[project.optional-dependencies]
test = [
    "homeassistant>=2025.3.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
